name: Refresh profile README

on:
  schedule:
    # Every 15 minutes; GitHub's floor is 5 and hourly is "0 * * * *". Runs may be delayed under load.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile-readme.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "No README changes."
            exit 0
          fi
          git add README.md
          git commit -m "chore: refresh profile README"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push

      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repo activity.
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was ${age} day(s) ago"
          if [ "${age}" -ge 45 ]; then
            git commit --allow-empty -m "chore: keep the scheduled workflow alive"
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
            git push
          fi
